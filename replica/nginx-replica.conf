# ---------------------------------------------------------------------------
# replica — sirve ganamos7.com desde un dominio propio e inyecta el asistente.
#
#   >>> Proxear la plataforma requiere autorización del operador. <<<
#
# MULTI-CLIENTE: el server es CATCH-ALL de *.faunotattoo.com. El panel crea un
# subdominio por cliente (<slug>.faunotattoo.com) y todos entran por acá; db.php
# resuelve la base de datos por el dominio (Host). Un mismo bloque sirve a todos.
#
# CLIENTES SIN DOMINIO PROPIO: entran por PATH bajo ganamoscrm.online en vez de
# subdominio -> ganamoscrm.online/<slug>/crm.html, .../<slug>/gp-api/algo.php.
# Los locations con `(?<slug>[a-z0-9-]+)` más abajo son los que arman esto: el
# slug capturado se manda a PHP como header X-Tenant-Slug (solo para /gp-api/,
# que es lo único que habla con la base); las páginas HTML son los mismos
# archivos físicos de siempre, no hay copia por cliente. Ver api/db.php.
#
# Este archivo es el ESPEJO EXACTO de /etc/nginx/sites-available/replica en el
# VPS. Editalo acá y deployá con:   .\replica\subir.ps1 -Config
# (hace backup del vivo, sube este, corre `nginx -t` y recién ahí recarga).
#
# Instalar a mano (si hiciera falta):
#   sudo cp nginx-replica.conf /etc/nginx/sites-available/replica
#   sudo ln -s /etc/nginx/sites-available/replica /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/replica && sudo cp widget.js /var/www/replica/
#   sudo certbot --nginx -d ganamos.faunotattoo.com
#   sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

# Conexiones reutilizadas contra la plataforma.
#
# Sin esto, CADA pedido abre una conexión TLS nueva contra ganamos7.com: un
# handshake completo por archivo. Un SPA pide decenas de archivos para pintar
# una pantalla, así que era la mayor parte de la lentitud.
#
# OJO: nginx resuelve este nombre UNA sola vez, al arrancar. Si la plataforma
# cambia de IP hay que hacer `systemctl reload nginx`.
upstream plataforma {
    server ganamos7.com:443;
    keepalive          32;
    keepalive_timeout  60s;
    keepalive_requests 1000;
}

# WebSockets. El valor VACÍO (no "close") es lo que habilita el keepalive de
# arriba: con `close` nginx cerraba la conexión al upstream en cada pedido.
map $http_upgrade $rep_conn {
    default upgrade;
    ''      "";
}

# Con qué se reemplaza </body> al inyectar el asistente. En el NAVEGADOR lo mete
# el server. En el APK NO: la app trae su propio widget con el token del puente
# (window.__gp_app_tk) en el orden correcto; si el server también lo inyectara,
# quedarían DOS widgets (uno sin token). El APK se reconoce por su User-Agent,
# que MainActivity marca con "GOLDPAW/1.x".
map $http_user_agent $gp_body_fin {
    default    '<script src="/replica/widget.js" defer></script></body>';
    "~GOLDPAW" '</body>';
}

server {
    listen 80;
    server_name ganamos.faunotattoo.com *.faunotattoo.com ganamoscrm.online www.ganamoscrm.online *.ganamoscrm.online;
    return 301 https://$host$request_uri;
}

server {
    # Forma vieja a propósito: `http2 on;` (nginx 1.25+) no existe en 1.18, que
    # es lo que trae Ubuntu 22.04, y ahí el `nginx -t` falla. Así anda en las dos.
    listen 443 ssl http2;
    server_name ganamos.faunotattoo.com *.faunotattoo.com ganamoscrm.online www.ganamoscrm.online *.ganamoscrm.online;

    # certbot completa estas dos.
    ssl_certificate     /etc/letsencrypt/live/ganamos.faunotattoo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ganamos.faunotattoo.com/privkey.pem;

    root /var/www/replica;
    client_max_body_size 12m;
    proxy_read_timeout 120s;

    # Comprimir lo que sale hacia el jugador.
    #
    # Es la mitad importante del arreglo: el HTML llega sin comprimir desde la
    # plataforma (hace falta así para poder inyectar el widget), pero al menos
    # sale comprimido hacia el celular, que es el tramo lento.
    gzip              on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    # (1) el asistente, servido local ANTES del proxy
    location = /replica/widget.js {
        try_files /widget.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # (1b) PÁGINAS PROPIAS servidas local (CRM, admin, chat) y el avatar del chat.
    #
    # Sin esto, /replica/crm.html termina en `location /` -> se lo lleva la
    # PLATAFORMA y el CRM nunca aparece. `^~` gana sobre el location de estáticos
    # de abajo (~* \.(...)$), así todo lo que empieza con /replica/ se sirve del
    # disco del VPS. widget.js conserva su `location =` exacto (gana sobre este).
    #
    # root /var/www  =>  /replica/crm.html se lee de /var/www/replica/crm.html.
    # Los archivos los sube subir.ps1 (widget.js, crm.html, admin.html,
    # chat.html, logo.png).
    #
    # Resultado: el CRM de cada cliente vive en
    #   https://<cliente>.faunotattoo.com/replica/crm.html
    # y db.php lo aísla por el dominio. NO se pasa ningún id de cliente por URL.
    location ^~ /replica/ {
        root /var/www;
        add_header Cache-Control "no-store" always;
    }

    # (1c) LAS MISMAS PÁGINAS, pero en la RAÍZ (URL linda, sin /replica/).
    # Exact match: gana sobre `location /` (que proxea a la plataforma), así
    # https://<cliente>.faunotattoo.com/crm.html se sirve del disco. widget.js y
    # el logo siguen bajo /replica/ porque los pide el <script> inyectado.
    # Siguen andando también las /replica/*.html de arriba: son dos URLs para lo
    # mismo, usá la corta.
    location = /crm.html   { root /var/www/replica; add_header Cache-Control "no-store" always; }
    location = /admin.html { root /var/www/replica; add_header Cache-Control "no-store" always; }
    location = /chat.html  { root /var/www/replica; add_header Cache-Control "no-store" always; }

    # (1c-bis) CLIENTES SIN DOMINIO PROPIO: entran por /<slug>/crm.html en vez
    # de un subdominio (ganamoscrm.online/<slug>/... en vez de <slug>.ganamos...).
    # Mismos archivos físicos que arriba (root /var/www/replica): el slug es
    # solo ruteo, no hay contenido distinto por cliente — quien lo aísla es
    # db.php, vía el header X-Tenant-Slug que la sub-location de /gp-api/ manda
    # más abajo. El regex exige minúsculas/números/guión, como slug en la BD.
    location ~ ^/(?<slug>[a-z0-9-]+)/(?<pagina>crm|admin|chat)\.html$ {
        root /var/www/replica;
        try_files /$pagina.html =404;
        add_header Cache-Control "no-store" always;
    }
    # El widget también, para cuando el navegador lo pida por esa ruta.
    location ~ ^/(?<slug>[a-z0-9-]+)/replica/widget\.js$ {
        try_files /widget.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # (1d) EL SERVICE WORKER de las notificaciones. Va en la RAÍZ a propósito:
    # el scope de un SW es su propia carpeta, así que /sw.js cubre todo el sitio
    # (incluido /home). Si estuviera en /replica/ no cubriría la página del
    # jugador. No se cachea: si cambia, tiene que tomar el nuevo al toque.
    location = /sw.js {
        root /var/www/replica;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # (2) ESTÁTICOS.
    #
    # Van por separado por una sola razón: acá NO se pisa Accept-Encoding, así
    # que el bundle de React, el CSS y las imágenes viajan comprimidos desde la
    # plataforma y pasan de largo. sub_filter solo toca text/html, o sea que
    # acá no hacía nada y el costo era puro.
    #
    # OJO, regla de nginx que muerde: si un location define CUALQUIER
    # proxy_set_header, deja de heredar TODOS los del nivel de arriba. Por eso
    # están repetidos enteros; borrar uno rompe el proxy en silencio.
    location ~* \.(?:js|mjs|css|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot|mp[34]|webm|wasm|map)$ {
        proxy_pass              https://plataforma;
        proxy_http_version      1.1;
        proxy_ssl_server_name   on;
        proxy_ssl_name          ganamos7.com;

        proxy_set_header        Host              ganamos7.com;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Referer           https://ganamos7.com/;
        proxy_set_header        Origin            https://ganamos7.com;
        proxy_set_header        Connection        "";
        # Accept-Encoding NO se toca: que venga comprimido.

        proxy_redirect          ~^https?://ganamos7\.com/(.*)$   /$1;
    }

    # (3) todo lo demás -> la plataforma, con el widget inyectado
    # CORTE Fase 0: la API del VPS, publica, en /gp-api/ -> php-fpm local.
    location ^~ /gp-api/ {
        alias /var/www/api/;
        location ~ ^/gp-api/(?<f>.+\.php)$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/api/$f;
        }
    }

    # (3b) MISMA API, pero para un cliente SIN dominio propio: entra por
    # /<slug>/gp-api/algo.php. El slug capturado se manda como header a PHP
    # (HTTP_X_TENANT_SLUG en $_SERVER); db.php lo usa para elegir la base de
    # ESE cliente en vez de la del dominio raíz. El archivo PHP servido es
    # siempre el mismo físico en /var/www/api/ — no hay una copia por cliente.
    location ~ ^/(?<slug>[a-z0-9-]+)/gp-api/(?<f>.+\.php)$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/api/$f;
        fastcgi_param HTTP_X_TENANT_SLUG $slug;
    }

    location ^~ /panel/ {
        alias /var/www/panel/;
        index panel.html;
        location ~ ^/panel/(?<f>.+\.php)$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/panel/$f;
        }
    }

    # (1e) ADJUNTOS (comprobantes). Se referencian como /api/uploads/... (así los
    # guardó subir.php desde siempre), pero /api/ en la réplica es de la
    # PLATAFORMA. Este location —más específico, con ^~— los sirve de NUESTRO
    # disco sin robarle /api/user/* a la plataforma. Si el archivo no está en el
    # VPS (se subió cuando todo vivía en Hostinger), cae al proxy a Hostinger.
    location ^~ /api/uploads/ {
        root /var/www;                    # /api/uploads/x -> /var/www/api/uploads/x
        try_files $uri @uploads_hostinger;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location @uploads_hostinger {
        proxy_pass https://orange-crab-483661.hostingersite.com;
        proxy_ssl_server_name on;
        proxy_ssl_name        orange-crab-483661.hostingersite.com;
        proxy_set_header Host orange-crab-483661.hostingersite.com;
        # El WAF de Hostinger corta lo que no parece navegador.
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        proxy_pass              https://plataforma;
        proxy_http_version      1.1;
        proxy_ssl_server_name   on;
        proxy_ssl_name          ganamos7.com;

        proxy_set_header        Host              ganamos7.com;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Referer           https://ganamos7.com/;
        proxy_set_header        Origin            https://ganamos7.com;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        $rep_conn;

        # sub_filter necesita el HTML SIN comprimir. Este es el único lugar
        # donde se paga ese costo, y acá sí vale la pena.
        proxy_set_header        Accept-Encoding   "";

        proxy_cookie_domain     ganamos7.com  $host;
        proxy_redirect          ~^https?://ganamos7\.com/(.*)$   /$1;

        sub_filter_once         on;
        sub_filter_types        text/html;
        # Navegador: inyecta el widget. APK: deja </body> igual (ver el map de
        # $gp_body_fin arriba) porque la app inyecta el suyo con el token.
        sub_filter '</body>' $gp_body_fin;

        # OJO: no agregues logging del cuerpo de los pedidos: por acá pasa el login.
    }
}
