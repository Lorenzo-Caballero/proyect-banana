# ---------------------------------------------------------------------------
# replica — sirve ganamos7.com desde un dominio propio e inyecta el asistente.
#
#   >>> Proxear la plataforma requiere autorización del operador. <<<
#
# POR QUÉ ESTE ARCHIVO ES ASÍ (medido, no supuesto):
#
#   * La plataforma está en MOSCÚ (109.238.90.236). Desde Argentina son ~250-320
#     ms de ida y vuelta. Eso es física, no configuración: ningún ajuste de acá
#     hace que una llamada a la API sea rápida.
#   * Su bundle pesa 3,66 MB, viaja SIN COMPRIMIR y SIN Cache-Control. Tardaba
#     7,4 s por jugador y por visita.
#   * Pero el nombre del bundle lleva hash de Vite (index-C4Ib8z9Z.js), así que
#     cambia en cada deploy => se puede cachear para siempre sin servir viejo.
#
# La estrategia entonces es: este VPS (São Paulo, cerca de los jugadores) hace
# de CDN de los estáticos. El primer jugador paga el viaje a Moscú; el resto lo
# recibe de Brasil, comprimido. Lo dinámico (login, saldo, juegos) sigue
# costando lo que cuesta Moscú y no hay forma de evitarlo.
#
# INSTALAR (son TRES pasos, no uno):
#
#   1) La caché se declara en el contexto http, o sea en /etc/nginx/nginx.conf,
#      NO acá. Agregá adentro de `http { ... }`:
#
#        proxy_cache_path /var/cache/nginx/replica levels=1:2
#                         keys_zone=replica:50m max_size=2g
#                         inactive=30d use_temp_path=off;
#
#      y creá la carpeta:  sudo mkdir -p /var/cache/nginx/replica
#
#   2) sudo cp replica-proxy.conf /etc/nginx/snippets/
#      sudo cp nginx-replica.conf /etc/nginx/sites-available/replica
#      sudo ln -s /etc/nginx/sites-available/replica /etc/nginx/sites-enabled/
#      sudo mkdir -p /var/www/replica && sudo cp widget.js /var/www/replica/
#      sudo certbot --nginx -d ganamos.faunotattoo.com
#
#   3) sudo nginx -t     <-- si esto falla, NO recargues
#      sudo systemctl reload nginx
#
# COMPROBAR que la caché anda:
#   curl -sI https://ganamos.faunotattoo.com/assets/<el-bundle>.js | grep -i x-cache
#   La primera vez dice MISS; la segunda, HIT. Si siempre dice MISS, la caché
#   no está funcionando y volvés a estar como antes.
# ---------------------------------------------------------------------------

# Conexiones reutilizadas contra la plataforma. Sin esto, CADA pedido abre un
# TLS nuevo contra Moscú: un handshake de ~300 ms por archivo.
#
# OJO: nginx resuelve este nombre UNA sola vez, al arrancar. Si la plataforma
# cambia de IP hay que hacer `systemctl reload nginx`.
upstream plataforma {
    server ganamos7.com:443;
    keepalive          32;
    keepalive_timeout  60s;
    keepalive_requests 1000;
}

# WebSockets. El valor VACÍO (no "close") es lo que habilita el keepalive de
# arriba: con `close` nginx cerraba la conexión al upstream en cada pedido.
map $http_upgrade $rep_conn {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    server_name ganamos.faunotattoo.com;
    return 301 https://$host$request_uri;
}

server {
    # Forma vieja a propósito: `http2 on;` (nginx 1.25+) no existe en 1.18, que
    # es lo que trae Ubuntu 22.04, y ahí el `nginx -t` falla. Así anda en las dos.
    listen 443 ssl http2;
    server_name ganamos.faunotattoo.com;

    # certbot completa estas dos.
    ssl_certificate     /etc/letsencrypt/live/ganamos.faunotattoo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ganamos.faunotattoo.com/privkey.pem;

    root /var/www/replica;
    client_max_body_size 12m;
    proxy_read_timeout 120s;

    # La plataforma manda todo sin comprimir, así que comprimimos nosotros.
    # Sobre el bundle de 3,66 MB esto solo ya corta ~4x.
    gzip              on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    # (1) el asistente, servido local ANTES del proxy
    location = /replica/widget.js {
        try_files /widget.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # (2) LOS ASSETS CON HASH. Acá está la mejora grande.
    #
    # Vite les pone un hash en el nombre, así que un archivo dado nunca cambia
    # de contenido: se cachea 30 días en el VPS y un año en el navegador.
    # Cuando la plataforma haga deploy, el nombre cambia y se baja el nuevo.
    location ^~ /assets/ {
        proxy_pass https://plataforma;
        include    snippets/replica-proxy.conf;
        proxy_set_header Connection "";       # keepalive con el upstream

        proxy_cache            replica;
        proxy_cache_valid      200 301 302 30d;
        proxy_cache_valid      404 1m;
        # La plataforma no manda Cache-Control; sin esto nginx no cachearía nada.
        proxy_ignore_headers   Cache-Control Expires Set-Cookie;
        # Un estático no tiene por qué traer cookie de sesión, y si la trae no
        # puede quedar guardada en una caché compartida.
        proxy_hide_header      Set-Cookie;
        # Si 100 jugadores entran juntos con la caché fría, que baje UNO solo.
        proxy_cache_lock       on;
        proxy_cache_lock_timeout 20s;
        # Si Moscú se cae, se sigue sirviendo lo viejo en vez de romper.
        proxy_cache_use_stale  error timeout updating
                               http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache $upstream_cache_status always;   # MISS / HIT
    }

    # (3) El resto de los estáticos (imágenes, fuentes, sonidos). Estos NO
    # llevan hash, así que se cachean poco: si la plataforma cambia un logo,
    # queremos verlo el mismo día y no dentro de un año.
    location ~* \.(?:js|mjs|css|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot|mp[34]|webm|wasm|map)$ {
        proxy_pass https://plataforma;
        include    snippets/replica-proxy.conf;
        proxy_set_header Connection "";

        proxy_cache            replica;
        proxy_cache_valid      200 301 302 24h;
        proxy_cache_valid      404 1m;
        proxy_ignore_headers   Cache-Control Expires Set-Cookie;
        proxy_hide_header      Set-Cookie;
        proxy_cache_lock       on;
        proxy_cache_use_stale  error timeout updating
                               http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Cache $upstream_cache_status always;
    }

    # (4) todo lo demás -> la plataforma, con el widget inyectado.
    #
    # NADA de esto se cachea: son el login, el saldo y las partidas. Servir eso
    # de una caché compartida sería mostrarle a un jugador la sesión de otro.
    location / {
        proxy_pass https://plataforma;
        include    snippets/replica-proxy.conf;

        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        $rep_conn;

        # sub_filter necesita el HTML SIN comprimir. Este es el único lugar
        # donde se paga ese costo, y acá sí vale la pena: el HTML son 4 KB.
        proxy_set_header        Accept-Encoding   "";

        proxy_cookie_domain     ganamos7.com  $host;

        sub_filter_once         on;
        sub_filter_types        text/html;
        sub_filter '</body>' '<script src="/replica/widget.js" defer></script></body>';

        # OJO: no agregues logging del cuerpo de los pedidos: por acá pasa el login.
    }
}
