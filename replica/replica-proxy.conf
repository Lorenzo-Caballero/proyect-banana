# ---------------------------------------------------------------------------
# Cabeceras comunes hacia la plataforma. Se incluye desde CADA location de
# nginx-replica.conf.
#
# Existe como archivo aparte por una regla de nginx que muerde: si un location
# define CUALQUIER proxy_set_header, deja de heredar TODOS los del nivel de
# arriba. Con tres locations, copiar y pegar la lista terminaba en que alguien
# olvida uno y el proxy falla en silencio. Así hay una sola copia.
#
# Va en:  /etc/nginx/snippets/replica-proxy.conf
# ---------------------------------------------------------------------------

proxy_http_version      1.1;
proxy_ssl_server_name   on;

# Con `upstream plataforma`, sin esto nginx mandaria "plataforma" como SNI y la
# plataforma cortaria el TLS.
proxy_ssl_name          ganamos7.com;

proxy_set_header        Host              ganamos7.com;
proxy_set_header        X-Real-IP         $remote_addr;
proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header        X-Forwarded-Proto $scheme;
proxy_set_header        Referer           https://ganamos7.com/;
proxy_set_header        Origin            https://ganamos7.com;

proxy_redirect          ~^https?://ganamos7\.com/(.*)$   /$1;
