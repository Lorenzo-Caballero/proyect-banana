<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ganamos</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<style>
  :root{
    --bg:#0a0718; --bar:#140f2e; --line:#2a2350; --ink:#eef0fb; --muted:#9aa0c4;
    --violet:#7c6cf0; --violet2:#9a8cff; --red:#f0716f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
    font:14.5px/1.5 system-ui,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;
    background:var(--bar);border-bottom:1px solid var(--line);flex:none;z-index:30}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .m{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(160deg,var(--violet2),var(--violet));box-shadow:0 6px 16px rgba(124,108,240,.4)}
  .brand .m svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2}
  .brand b{font-size:16px;letter-spacing:.4px} .brand b span{color:var(--violet2)}
  .bar .acts{display:flex;align-items:center;gap:8px}
  .bar button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--muted);padding:8px 13px;border-radius:10px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
  .bar button:hover{color:var(--ink);border-color:var(--violet)}
  .bar button.on{color:var(--violet2);border-color:var(--violet);background:rgba(124,108,240,.14)}
  .bar button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
  .bar .salir:hover{color:var(--red);border-color:var(--red)}

  .split{flex:1;display:flex;min-height:0;position:relative}
  .gamewrap{flex:1;min-width:0;position:relative;display:flex;overflow:hidden}
  /* El iframe es SOLO vista previa: el navegador particiona su storage y sus
     cookies por ser de otro dominio, asi que ahi adentro el login nunca cierra.
     pointer-events:none evita que el usuario intente loguearse dentro. */
  .game{flex:1;min-width:0;border:0;background:#05030f;pointer-events:none}

  .playover{position:absolute;inset:0;display:grid;place-items:center;padding:20px;
    background:linear-gradient(180deg,rgba(10,7,24,.5),rgba(10,7,24,.86))}
  .playcard{max-width:390px;text-align:center;background:var(--bar);border:1px solid var(--line);
    border-radius:16px;padding:24px 22px;box-shadow:0 22px 60px rgba(0,0,0,.55)}
  .playcard h3{margin:0 0 8px;font-size:17.5px;letter-spacing:.2px}
  .playcard p{margin:0 0 17px;color:var(--muted);font-size:13.5px}
  .playbtn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;
    padding:12px 21px;border-radius:12px;font:700 14px inherit;color:#fff;font-family:inherit;
    background:linear-gradient(145deg,var(--violet2),var(--violet));box-shadow:0 10px 26px rgba(124,108,240,.45);
    transition:filter .15s,transform .12s}
  .playbtn:hover{filter:brightness(1.08)} .playbtn:active{transform:translateY(1px)}
  .playbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
  .playnote{margin-top:13px;font-size:12px;color:var(--muted);line-height:1.45}
  .chatwrap{width:390px;flex:none;border-left:1px solid var(--line);background:var(--bg);
    transition:width .25s ease;overflow:hidden}
  .chatwrap iframe{width:390px;height:100%;border:0;display:block}
  body:not(.chat-shown) .chatwrap{width:0}
  .backdrop{display:none}

  @media(max-width:820px){
    .chatwrap{position:fixed;top:53px;right:0;bottom:0;width:min(400px,92vw)!important;z-index:25;
      border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.5);
      transform:translateX(101%);transition:transform .25s ease}
    .chatwrap iframe{width:100%}
    body.chat-shown .chatwrap{transform:none}
    body.chat-shown .backdrop{display:block;position:fixed;inset:53px 0 0 0;background:rgba(0,0,0,.45);z-index:24}
    .brand b{font-size:15px}
  }
</style>
</head>
<body class="chat-shown">
  <header class="bar">
    <div class="brand">
      <span class="m"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
      <b>gana<span>mos</span></b>
    </div>
    <div class="acts">
      <button id="toggleChat" class="on" title="Mostrar/ocultar asistente">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="lbl">Asistente</span>
      </button>
      <button class="salir" id="salir" title="Cerrar sesión">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span class="lbl">Salir</span>
      </button>
    </div>
  </header>

  <div class="split">
    <div class="gamewrap">
      <!-- Vista previa no interactiva. El juego real se abre en pestaña nueva. -->
      <iframe class="game" id="game" src="https://ganamos7.com/home"
              title="Vista previa del juego" tabindex="-1" aria-hidden="true"
              allow="fullscreen; autoplay" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="playover">
        <div class="playcard">
          <h3>Jugá en ganamos7</h3>
          <p>El juego se abre en una pestaña nueva. El navegador no permite iniciar
             sesión dentro de un iframe de otro dominio, así que el login tiene que
             hacerse en su propia pestaña.</p>
          <button class="playbtn" id="abrirJuego" type="button">
            <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
            Abrir juego
          </button>
          <div class="playnote">El asistente de ganamos queda acá, siempre a mano.</div>
        </div>
      </div>
    </div>
    <div class="backdrop" id="backdrop"></div>
    <div class="chatwrap"><iframe id="chat" src="chat.html" title="Asistente"></iframe></div>
  </div>

<script>
(function(){
  "use strict";
  // Gate: sin login propio, a la página de acceso.
  let AUTH = null; try { AUTH = localStorage.getItem('API_AUTH_ACCESS_TOKEN'); } catch(e){}
  if (!AUTH){ location.replace('acceso.html'); return; }

  const $ = id => document.getElementById(id);
  const esMobile = () => matchMedia('(max-width:820px)').matches;

  // Juego en pestaña nueva: es la unica forma de que el login de la plataforma
  // funcione (en el iframe las cookies/localStorage van particionados).
  const JUEGO_URL = 'https://ganamos7.com/';
  $('abrirJuego').addEventListener('click', ()=>{
    window.open(JUEGO_URL, 'goldpaw_juego', 'noopener');
  });

  // En celular arranca con el chat cerrado (juego a pantalla completa).
  if (esMobile()) document.body.classList.remove('chat-shown');

  function toggle(){
    const on = document.body.classList.toggle('chat-shown');
    $('toggleChat').classList.toggle('on', on);
  }
  $('toggleChat').addEventListener('click', toggle);
  $('backdrop').addEventListener('click', ()=>{ document.body.classList.remove('chat-shown'); $('toggleChat').classList.remove('on'); });

  $('salir').addEventListener('click', ()=>{
    try{ localStorage.removeItem('API_AUTH_ACCESS_TOKEN'); }catch(e){}
    location.replace('acceso.html');
  });
})();
</script>
</body>
</html>
