# Xmx bajo A PROPOSITO: esta maquina tiene ~3.9 GB de RAM. Con -Xmx2048m la JVM
# de Gradle reventaba al reservar heap ("insufficient memory ... G1 virtual
# space") cuando el resto del sistema ya ocupaba la RAM. 1 GB alcanza de sobra
# (el build usa ~450 MB reales) y deja aire para el SO y el resto de las apps.
org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
# Mismo motivo: el daemon de Kotlin es un proceso aparte; sin tope se suma al de
# Gradle y entre los dos se comen la RAM.
kotlin.daemon.jvmargs=-Xmx512m
# parallel/caching quedaron apagados: con transforms de AGP rompian el
# mergeExtDex ("Could not read workspace metadata"). El build tarda un poco
# mas pero es reproducible. workers.max=1 tambien baja el pico de memoria.
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.workers.max=1

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
